/* ATLAS 4 — visual mobile-first e animações */
:root{--bg:#080d10;--side:#101719;--surface:#141d21;--surface2:#1b282a;--surface3:#263333;--stroke:#304141;--lime:#aaff21;--limeD:#243b17;--r:20px}
body{background:radial-gradient(ellipse at 90% -4%,rgba(101,183,25,.1),transparent 38%),#080d10}
.btn,.tile,.shortcut,.card,.stat,.nav-btn,.list-row,.catalog-item,.template-card{transition:transform .22s ease,box-shadow .2s ease,border-color .2s ease,background .2s ease}
@media(hover:hover){.btn:hover,.shortcut:hover,.template-card:hover{transform:translateY(-2px)}.tile:hover{transform:translateY(-2px)}.card:hover{border-color:#426045}}
.btn:active,.nav-btn:active,.tile:active,.shortcut:active{transform:scale(.973)}
#content>*,.modal{animation:slideFade .35s both}
@keyframes slideFade{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:translateY(0)}}
@keyframes softGlow{0%,100%{box-shadow:0 0 0 1px rgba(170,255,33,.16),0 0 20px rgba(170,255,33,.05)}50%{box-shadow:0 0 0 1px rgba(170,255,33,.34),0 0 32px rgba(170,255,33,.17)}}
@keyframes floating{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}
@keyframes progressIn{from{width:0}to{width:100%}}
@keyframes shimmer{from{transform:translateX(-150%)}to{transform:translateX(240%)}}
@keyframes pop{from{transform:scale(.83);opacity:0}to{transform:scale(1);opacity:1}}
.hero{position:relative;overflow:hidden;border-color:#4b6d34}
.hero:after{content:' ';position:absolute;inset:-100% auto auto 58%;width:50%;height:240%;background:linear-gradient(90deg,transparent,rgba(170,255,33,.055),transparent);transform:rotate(35deg);pointer-events:none;animation:shimmer 10s ease-in-out infinite}
.hero .actions,.hero h2,.hero p{position:relative;z-index:1}

/* ATLAS V5 — experiência mobile reconstruída, preserva dados V3 */
:root{--bg:#090d0e;--side:#101614;--surface:#141b1a;--surface2:#1c2523;--surface3:#273530;--stroke:#2e4138;--faint:#1b2a25;--txt:#f4f8f4;--muted:#a1b4a6;--lime:#adfa42;--limeD:#1c3520;--r:22px;--shadow:0 18px 56px rgba(0,0,0,.15)}
body{background:#090d0e;background-image:radial-gradient(circle at 100% 0%,rgba(120,255,87,.065),transparent 38%);letter-spacing:-.08px}
.app-icon{display:inline-flex;width:1.15em;height:1.15em;vertical-align:-.21em;align-items:center;justify-content:center;flex:none;color:inherit}
.app-icon svg{height:100%;width:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn .ico .app-icon,.mobile-nav .app-icon{width:22px;height:22px}
.mobile-nav button span{font-size:inherit!important;line-height:1}
.mobile-nav{box-shadow:0 -12px 32px rgba(0,0,0,.34)}
.mobile-nav button{transition:color .18s ease,background .18s ease,transform .18s ease}
.mobile-nav button.active .app-icon{filter:drop-shadow(0 2px 9px rgba(173,250,66,.2))}
#content{max-width:1160px;margin:auto}
#content>.top{align-items:center}
.top h1{letter-spacing:-.9px;font-weight:860}
.card{background:linear-gradient(160deg,#161f1d,#111918);border:1px solid var(--stroke);box-shadow:0 8px 24px rgba(0,0,0,.07)}
.stat{background:linear-gradient(150deg,#19241e,#141e1a);border:1px solid #294337}
.stat .value{letter-spacing:-.85px}
.btn.primary{box-shadow:0 3px 14px rgba(168,245,58,.13)}
.btn.primary:active{box-shadow:none}
.hero{background:linear-gradient(110deg,#1b2e22,#19251e 70%,#131e1b);border:1px solid #4b6a3b;position:relative;isolation:isolate}
.hero:before{content:'';position:absolute;z-index:-1;right:-5%;bottom:-35px;width:45%;height:calc(100% + 70px);background-image:var(--hero-mascot);background-position:center center;background-size:contain;background-repeat:no-repeat;opacity:.20;filter:saturate(.9);pointer-events:none}
.hero:after{opacity:.45}
.hero h2{line-height:1.09;letter-spacing:-1.1px;font-weight:890}
#auth{background:#070d0c}
.auth-intro{background:radial-gradient(circle at 55% 47%,rgba(84,140,48,.16),transparent 46%),#121e17}
.auth-mascot{filter:drop-shadow(0 10px 23px rgba(50,200,30,.17))}

.v5-home .v5-feature{padding:24px;min-height:198px;display:flex;flex-direction:column;justify-content:center;margin:0 0 14px}

.v5-home .v5-section{margin:21px 0 10px;display:flex;align-items:end;justify-content:space-between;gap:14px}

.catalog-item,.template-card{background:linear-gradient(150deg,#19231d,#141c1a);border-color:#2e4037;border-radius:17px}
.catalog-item h3{line-height:1.23}

.pdf-mode .modal{max-width:760px;width:100%;max-height:96dvh}
.pdf-mode .modal-top{position:sticky;top:0;background:#121c19;z-index:2;margin:-3px -3px 12px;padding:3px 3px 11px}

.pdf-mode .footer-actions button{min-height:45px}
.pdf-preview-desc{font-size:12px;color:var(--muted);margin:0 0 15px}
.pdf-preview-file{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--lime);margin-bottom:12px;font-weight:750}
/* Modal accessibility and iOS keyboard */
.modal-back{overscroll-behavior:contain}
.modal{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.modal-top{align-items:center}
.footer-actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}

function ex(id,sets,min,max,rest=90,note=''){return{id:'i_'+Math.random().toString(36).slice(2,10),exerciseId:id,sets,min,max,rest,note}}
function day(n,name,focus,items=[],cardio=0,cardioType='',note=''){return{id:'d_'+n,weekday:n,name,focus,items,cardio,cardioType,note,rest:items.length===0}}
function blankDays(){return [0,1,2,3,4,5,6].map(n=>day(n,'Descanso','Recuperação'))}
function planOriginal(){return{name:'Plano original • 5 dias',goal:'Treino de força e hipertrofia no cutting',description:'Transcrito e organizado a partir do PDF enviado, com descanso na quarta e no domingo.',days:[
 day(0,'Descanso','Descanso total',[],0,'','Descanso total.'),
 day(1,'Push','Peito • ombros • tríceps',[ex('supino-reto',4,6,10,150,'Principal: busque progressão técnica.'),ex('supino-inc-h',3,8,12),ex('desenv-h',3,8,12),ex('elev-lat',4,12,15),ex('tri-corda',3,10,12),ex('tri-frances',3,10,12)],25,'Esteira inclinada ou bicicleta'),
 day(2,'Pull','Costas • bíceps',[ex('barra-puxada',4,6,10,150),ex('remada-curvada',4,8,10,150),ex('remada-uni',3,10,12),ex('facepull',3,12,15),ex('rosca-dir',3,8,12),ex('rosca-mart',3,10,12)],25,'Esteira inclinada ou bicicleta'),
 day(3,'Descanso','Passos do dia',[],0,'','Caminhada leve de 30 minutos ou alongamento de 10 minutos são opcionais no PDF.'),
 day(4,'Pernas','Quadríceps • posterior • panturrilhas',[ex('agachamento',4,6,10,150),ex('leg45',3,10,12,150),ex('stiff',3,8,10,150),ex('mesa-flex',3,10,12),ex('extensora',3,12,15),ex('pant-pe',4,12,15)],0,''),
 day(5,'Upper','Superior completo',[ex('supino-inc',3,8,10,150),ex('remada-cav',3,8,10,150),ex('desenv-maq',3,10,12),ex('puxada-neutra',3,10,12),ex('elev-lat',3,12,15),ex('rosca-alt',3,10,12),ex('tri-polia',3,10,12)],25,'Esteira inclinada ou bicicleta'),
 day(6,'Lower','Inferior • abdômen',[ex('passada',3,10,10,120,'10 repetições por perna.'),ex('terra-romeno',3,8,10,150),ex('cadeira-flex',3,12,12),ex('hip-thrust',3,10,12),ex('pant-sent',4,12,15),ex('abd-maq',3,15,15),ex('prancha',3,30,45,60,'Repetições em segundos.')],0,'')
 ]}}
function planFullbody(){let d=blankDays();d[1]=day(1,'Full Body A','Corpo inteiro',[ex('agachamento',3,6,10,150),ex('supino-reto',3,6,10,150),ex('remada-baixa',3,8,12),ex('terra-romeno',2,8,10),ex('elev-lat',2,12,15),ex('prancha',3,30,45)]);d[3]=day(3,'Full Body B','Corpo inteiro',[ex('leg45',3,10,12),ex('puxada-alta',3,8,12),ex('supino-inc-h',3,8,12),ex('hip-thrust',3,10,12),ex('tri-corda',2,10,15),ex('rosca-dir',2,10,15)]);d[5]=day(5,'Full Body C','Corpo inteiro',[ex('passada',3,10,10),ex('supino-maq',3,8,12),ex('remada-uni',3,10,12),ex('mesa-flex',3,10,12),ex('desenv-maq',2,10,12),ex('abd-maq',3,12,15)]);return{name:'Full Body • 3 dias',goal:'Rotina com três treinos semanais',description:'Alternativa de menor frequência, com foco no corpo inteiro.',days:d}}
function planUpperLower(){let d=blankDays();d[1]=day(1,'Upper A','Superior',[ex('supino-reto',3,6,10),ex('remada-curvada',3,8,12),ex('puxada-alta',3,8,12),ex('desenv-h',3,8,12),ex('rosca-dir',2,10,12),ex('tri-corda',2,10,12)]);d[2]=day(2,'Lower A','Inferior',[ex('agachamento',3,6,10),ex('stiff',3,8,10),ex('leg45',3,10,12),ex('mesa-flex',3,10,12),ex('pant-pe',3,12,15)]);d[4]=day(4,'Upper B','Superior',[ex('supino-inc-h',3,8,12),ex('puxada-neutra',3,8,12),ex('remada-cav',3,8,12),ex('elev-lat',3,12,15),ex('rosca-mart',2,10,12),ex('tri-frances',2,10,12)]);d[5]=day(5,'Lower B','Inferior + core',[ex('passada',3,10,10),ex('hip-thrust',3,10,12),ex('cadeira-flex',3,10,12),ex('extensora',3,12,15),ex('pant-sent',3,12,15),ex('prancha',3,30,45)]);return{name:'Upper / Lower • 4 dias',goal:'Hipertrofia com frequência equilibrada',description:'Alternativa para treinar parte superior e inferior duas vezes por semana.',days:d}}
function planMaquinas(){let d=blankDays();d[1]=day(1,'A • Superior','Máquinas',[ex('supino-maq',3,10,12),ex('remada-baixa',3,10,12),ex('puxada-alta',3,10,12),ex('desenv-maq',2,10,12),ex('tri-polia',2,12,15),ex('rosca-cabo',2,12,15)]);d[3]=day(3,'B • Inferior','Máquinas',[ex('leg45',3,10,12),ex('extensora',3,12,15),ex('cadeira-flex',3,12,15),ex('abdutora',2,12,15),ex('pant-sent',3,12,15),ex('abd-maq',2,12,15)]);d[5]=day(5,'C • Misto','Máquinas',[ex('supino-maq',3,10,12),ex('puxada-neutra',3,10,12),ex('agach-smith',3,10,12),ex('mesa-flex',3,10,12),ex('crucifixo-inv',2,12,15),ex('tri-maq',2,12,15),ex('rosca-scott',2,12,15)]);return{name:'Máquinas • 3 dias',goal:'Rotina predominantemente em máquinas',description:'Modelo prático para quem prefere máquinas. Adapte amplitudes e cargas.',days:d}}

function libraryResults(){let q=librarySearch.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let list=exercises().filter(x=>(!libraryGroup||x.group===libraryGroup)&&(!q||[x.name,x.group,x.equipment].join(' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(q)));return `<div class="help" style="margin-bottom:11px">${list.length} exercício(s) encontrado(s) • Tutorial com instruções e opção de vídeo online</div><div class="grid catalog">${list.map(x=>`<article class="catalog-item"><div class="row between"><span class="pill lime">${escapeHTML(x.group)}</span><span class="pill">${escapeHTML(x.equipment)}</span></div><h3>${escapeHTML(x.name)}</h3><p class="help">${escapeHTML(x.tip||'Execute com controle e amplitude confortável.')}</p><div class="actions"><button class="btn sm" data-act="exercise-info" data-id="${escapeHTML(x.id)}">Ver como fazer</button>${x.custom?`<button class="btn sm" data-act="custom-ex" data-id="${escapeHTML(x.id)}">Editar</button>`:''}</div></article>`).join('')||'<div class="empty">Nenhum exercício encontrado. Tente outro nome ou crie um exercício.</div>'}</div>`}

function arrayVolumeByWeek(){let map=new Map();for(let l of recentLogs(49)){let ws=dateKey(weekOf(parseDate(l.date)));map.set(ws,(map.get(ws)||0)+totalVolume(l))}let monday=weekOf();return Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(d.getDate()-(6-i)*7);let k=dateKey(d);return{label:String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'),value:Math.round(map.get(k)||0)}})}
function weekChart(){let data=arrayVolumeByWeek(),max=Math.max(...data.map(x=>x.value),1);return `<div class="weekgraph">${data.map(x=>`<div class="barWrap"><div class="barBox" title="${num(x.value)} kg"><div class="bar" style="height:${Math.max(2,100*x.value/max)}%"></div></div><small>${x.label}</small></div>`).join('')}</div>`}
function progressionFor(exId){let arr=[];for(let l of [...work.logs].sort((a,b)=>a.date.localeCompare(b.date))){for(let e of (l.entries||[])){if(e.exerciseId===exId){let s=(e.sets||[]).filter(x=>x.done&&Number(x.kg)>0&&Number(x.reps)>0);if(s.length)arr.push({date:l.date,peak:Math.max(...s.map(x=>Number(x.kg))),metTop:s.every(x=>Number(x.reps)>=Number(e.max||12)),below:s.every(x=>Number(x.reps)<Number(e.min||8)),reps:s.reduce((a,x)=>a+Number(x.reps),0),count:s.length,group:exerciseById(exId).group})}}}
if(!arr.length)return {text:'Registre séries e cargas para receber uma sugestão de progressão.',tone:'neutral',data:arr};let last=arr[arr.length-1],prior=arr[arr.length-2];if(prior&&last.metTop&&prior.metTop){let lower=['Quadríceps','Posterior','Glúteos','Panturrilhas'].includes(last.group);return {text:`Você atingiu o topo das repetições registradas em duas sessões. Se a execução e a recuperação estiverem boas, experimente aumentar a carga em cerca de ${lower?'2,5–5%':'2–5%'} e reavaliar.`,tone:'ok',data:arr}}
if(prior&&last.below&&prior.below)return{text:'Duas sessões ficaram abaixo da faixa planejada. Revise técnica, descanso e recuperação; pode ser útil reduzir um pouco a carga.',tone:'warn',data:arr};return{text:`Última carga registrada: ${num(last.peak)} kg. Busque consolidar repetições e técnica antes de aumentar.`,tone:'neutral',data:arr}}
function svgLine(points,label='kg'){let arr=points.slice(-9);if(!arr.length)return '<div class="empty">Ainda não há dados para o gráfico.</div>';let w=620,h=194,pad=34,vals=arr.map(x=>Number(x.value)||0),low=Math.min(0,...vals),hi=Math.max(1,...vals),span=hi-low||1,coord=arr.map((x,i)=>({x:pad+i*(w-2*pad)/Math.max(1,arr.length-1),y:h-pad-(Number(x.value)-low)/span*(h-2*pad),...x}));return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfico de evolução em ${escapeHTML(label)}"><line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}"/><polyline points="${coord.map(x=>x.x+','+x.y).join(' ')}" fill="none" stroke="#bdf56c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${coord.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#bdf56c"><title>${escapeHTML(p.date||'')}: ${num(p.value)} ${label}</title></circle>`).join('')}<text x="${pad}" y="18">${num(hi)} ${escapeHTML(label)}</text><text x="${w-pad}" y="${h-8}" text-anchor="end">${escapeHTML(arr[arr.length-1].date||'')}</text></svg>`}
function groupVolume(){let totals={};for(let l of recentLogs(7))for(let e of l.entries||[]){let g=exerciseById(e.exerciseId).group;totals[g]=(totals[g]||0)+(e.sets||[]).filter(x=>x.done).length}return totals}

function recoveryHTML(){let last={};for(let log of [...work.logs].sort((a,b)=>a.date.localeCompare(b.date)))for(let e of log.entries||[]){if((e.sets||[]).some(s=>s.done))last[exerciseById(e.exerciseId).group]=log.date}return `<div class="list">${T_GROUPS.filter(g=>g!=='Cardio').map(g=>{let days=last[g]?Math.floor((parseDate(dateKey())-parseDate(last[g]))/86400000):null;let label=days===null?'Sem dados':days===0?'Treinado hoje':days===1?'Treinado ontem':`${days} dias desde o último treino`;let status=days===null?'Sem histórico':days===0?'Recente':days===1?'Acompanhar':'Verifique como se sente';return `<div class="list-row"><div><strong>${g}</strong><div class="desc">${label}</div></div><span class="pill ${days===0?'orange':''}">${status}</span></div>`}).join('')}</div><p class="help">Indicador de tempo entre sessões; não mede recuperação fisiológica, fadiga ou prontidão real para treinar.</p>`}
function progressView(){let logs=[...work.logs].sort((a,b)=>b.date.localeCompare(a.date)),series=logs.reduce((s,l)=>s+doneSets(l).length,0),vol=logs.reduce((s,l)=>s+totalVolume(l),0),totalCardio=logs.reduce((s,l)=>s+Number(l.cardioMin||0),0);let allEx=[...new Set(logs.flatMap(l=>(l.entries||[]).map(e=>e.exerciseId)))],choice=allEx.includes(chartExerciseId)?chartExerciseId:allEx[0];chartExerciseId=choice||'';let prog=choice?progressionFor(choice):null;let wts=[...work.measurements].filter(x=>Number(x.weight)>0).sort((a,b)=>a.date.localeCompare(b.date));return `${page('Minha evolução','Acompanhe o que está melhorando',`<button class="btn primary" data-act="new-measure">+ Nova medida</button>`)}<div class="grid stats">${stat('Sessões',logs.length,'Total registrado')}${stat('Séries',num(series),'Concluídas')}${stat('Volume acumulado',num(vol)+' kg','Carga × repetições')}${stat('Cardio',num(totalCardio)+' min','Total registrado')}</div><div class="grid split"><section class="card"><h2>Volume por semana</h2><p class="subhead">Soma de carga × repetições das séries registradas</p>${weekChart()}</section><section class="card"><div class="card-head"><h2>Progressão por exercício</h2></div>${allEx.length?`<label class="field">Exercício<select id="chartExercise">${allEx.map(x=>`<option value="${escapeHTML(x)}" ${x===choice?'selected':''}>${escapeHTML(exerciseById(x).name)}</option>`).join('')}</select></label>${svgLine(prog.data.map(x=>({date:dateBR(x.date),value:x.peak})),'kg')}<div class="note ${prog.tone==='warn'?'warn':''}">${escapeHTML(prog.text)}</div>`:'<div class="empty">Comece a registrar séries e cargas para visualizar a progressão.</div>'}</section></div><div class="grid split section-space"><section class="card"><h2>Mapa muscular</h2><p class="subhead">Estimativa de séries concluídas nos últimos sete dias</p>${muscleMap()}</section><section class="card"><h2>Recuperação por histórico</h2><p class="subhead">Quanto tempo passou desde a última sessão de cada grupo</p>${r function settingsView(){let s=work.settings;return `${page('Configurações','Personalize o ATLAS e faça backups') }<div class="grid split"><section class="card"><h2>Meu perfil e preferências</h2><p class="subhead">As preferências ajudam a organizar sugestões, não substituem uma avaliação profissional.</p><form id="settingsForm"><label class="field">Seu nome como profissional (opcional)<input name="trainerName" value="${escapeHTML(s.trainerName)}" placeholder="Ex.: João Silva"></label><label class="field">Contato a exibir nos PDFs (opcional)<input name="trainerContact" value="${escapeHTML(s.trainerContact)}" placeholder="WhatsApp ou e-mail profissional"></label><label class="field">Meu objetivo<select name="goal">${GOALS.map(x=>`<option ${s.goal===x?'selected':''}>${escapeHTML(x)}</option>`).join('')}</select></label><div class="two-input"><label class="field">Nível<select name="level">${LEVELS.map(x=>`<option ${s.level===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Dias por semana<select name="weeklyDays">${[2,3,4,5,6].map(n=>`<option value="${n}" ${Number(s.weeklyDays)===n?'selected':''}>${n} dias</option>`).join('')}</select></label></div><button class="btn primary" type="submit">Salvar preferências</button></form></section><section class="card"><h2>Backups e dados</h2><p class="help">O armazenamento do navegador pode ser apagado ao limpar os dados do site ou trocar de aparelho. Salve cópias periódicas.</p><div class="list"><button class="btn block" data-act="backup">↓ Baixar backup JSON</button><button class="btn block" data-act="import-backup">↑ Restaurar backup JSON</button><button class="btn block" data-act="csv">↓ Exportar histórico CSV</button><button class="btn block danger" data-act="reset-user">Limpar meus dados</button></div><hr><h3>Login local</h3><p class="help">A senha serve apenas como barreira básica na tela. Seus dados não estão criptografados: alguém com acesso ao armazenamento do dispositivo pode vê-los.</p><button class="btn" data-act="logout">Sair desta conta</button></section></div><section class="card section-space"><h2>Instalação e sincronização</h2><div class="grid split"><div><h3>Instalar como aplicativo</h3><p class="help">Para funcionar como PWA instalável e offline, hospede os arquivos do pacote em um site HTTPS. Abrir apenas o HTML funciona, mas não instala a versão PWA completa.</p><button class="btn sm" data-act="install">Instalar, se disponível</button></div><div><h3>Usar em outros dispositivos</h3><p class="help">A sincronização automática e login online precisam de backend e conexão segura, que não fazem parte desta versão offline. Use Exportar / Restaurar backup JSON para transferir dados manualmente.</p><span class="pill orange">Sincronização automática indisponível</span></div></div></section>`}
function renderTimer(){if(!timerTarget)return;let x=Math.max(0,Math.ceil((timerTarget-Date.now())/1000));document.getElementById('timer').classList.remove('hidden');document.getElementById('timerValue').textContent=`${String(Math.floor(x/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`;if(x===0){stopRestTimer();toast('Descanso concluído!')}}
function startRestTimer(seconds){stopRestTimer();timerTarget=Date.now()+seconds*1000;renderTimer();timerTick=setInterval(renderTimer,300)}
function stopRestTimer(){clearInterval(timerTick);timerTick=null;timerTarget=0;document.getElementById('timer').classList.add('hidden')}
function startWorkout(today=false){if(work.draft){if(confirm('Você tem uma sessão em andamento. Quer retomá-la?')){go('sessao');return}else if(!confirm('Descartar a sessão anterior e iniciar outra?'))return}let d=today?scheduleFor(dateKey()):editedDay();if(!d?.items?.length)return toast('Este dia não possui exercícios');let p=plan();work.draft={id:id(),date:dateKey(),startedAt:new Date().toISOString(),planId:p.id,planName:p.name,dayName:d.name,cardioMin:d.cardio||0,durationMin:'',notes:'',entries:d.items.map(it=>({...clone(it),name:exerciseById(it.exerciseId).name,sets:Array.from({length:Number(it.sets)||3},()=>({kg:'',reps:'',rir:'',done:false}))}))};persist();go('sessao')}
function sessionView(){let s=work.draft;if(!s)return `${page('Sessão de treino','Nada em andamento')}<section class="card"><div class="empty">Você não iniciou um treino. <button class="btn primary" data-act="nav" data-view="treinos">Ver meus treinos</button></div></section>`;let count=s.entries.reduce((k,e)=>k+e.sets.length,0),done=doneSets(s).length;return `${page('Treino em andamento','Registre cargas e repetições',`<button class="btn danger sm" data-act="discard-workout">Descartar</button>`)}<section class="card hero"><div class="eyebrow">Sessão • ${dateBR(s.date)}</div><h2>${escapeHTML(s.dayName)}</h2><p>${done} de ${count} séries concluídas. Marque ✓ depois de realizar cada série.</p><div class="progressbar"><span class="help">${count?Math.round(done*100/count):0}%</span><div class="meter"><span style="width:${count?100*done/count:0}%"></span></div></div></section>${s.entries.map((e,i)=>`<section class="card exercise-session"><div class="exercise-title"><div class="row"><span class="badge-circle">${i+1}</span><div><h3>${escapeHTML(e.name)}</h3><div class="help">${e.min}–${e.max} reps • descanso sugerido ${e.rest||90}s</div></div></div><div class="actions"><button class="btn sm" data-act="exercise-info" data-id="${escapeHTML(e.exerciseId)}">Como fazer</button><button class="btn sm" data-act="timer" data-seconds="${Number(e.rest)||90}">⏱ Descanso</button></div></div><div class="scroll"><table class="sets-table"><thead><tr><th>Série</th><th>Kg</th><th>Reps</th><th>RIR</th><th>✓</th></tr></thead><tbody>${e.sets.map((v,j)=>`<tr class="${v.done?'done':''}"><td>${j+1}</td><td><input type="number" step="0.5" min="0" max="10000" data-set-field="kg" data-i="${i}" data-j="${j}" value="${escapeHTML(v.kg)}" aria-label="Carga série ${j+1}"></td><td><input type="number" min="0" max="1000" step="1" data-set-field="reps" data-i="${i}" data-j="${j}" value="${escapeHTML(v.reps)}" aria-label="Repetições série ${j+1}"></td><td><input type="number" min="0" max="10" step="1" data-set-field="rir" data-i="${i}" data-j="${j}" value="${escapeHTML(v.rir)}" aria-label="Repetições em reserva série ${j+1}"></td><td><input type="checkbox" data-set-done="1" data-i="${i}" data-j="${j}" ${v.done?'checked':''} aria-label="Concluir série ${j+1}"></td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn sm" data-act="add-set" data-i="${i}">+ Série</button><button class="btn sm" data-act="remove-set" data-i="${i}">− Série</button></div></section>`).join('')}<section class="card"><h2>Finalizar sessão</h2><p class="subhead">RIR = repetições que ainda conseguiria fazer com boa execução. É opcional.</p><div class="two-input"><label class="field">Cardio (min)<input id="draftCardio" type="number" min="0" max="500" value="${escapeHTML(s.cardioMin)}"></label><label class="field">Duração total (min)<input id="draftDuration" type="number" min="0" max="600" placeholder="Automático se vazio" value="${escapeHTML(s.durationMin)}"></label></div><label class="field">Observações<textarea id="draftNotes" placeholder="Como foi o treino?">${escapeHTML(s.notes)}</textarea></label><button class="btn primary block" data-act="finish-workout">✓ Salvar treino concluído</button></section>`}
function finishWorkout(){let s=work.draft;if(!s)return;if(!doneSets(s).length&&!confirm('Nenhuma série foi marcada. Salvar a sessão mesmo assim?'))return;let elapsed=Math.max(1,Math.round((Date.now()-new Date(s.startedAt))/60000));s.durationMin=Number(s.durationMin)||elapsed;s.finishedAt=new Date().toISOString();work.logs.push(clone(s));work.draft=null;persist();stopRestTimer();go('progresso');toast('Treino salvo no histórico!')}
function openModal(title,body,actions='',large=false){let r=document.getElementById('modalRoot');document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalActions').innerHTML=actions||'<button class="btn" data-act="close">Fechar</button>';document.getElementById('modalBox').classList.toggle('large',large);r.classList.add('open');setTimeout(()=>{if(window.innerWidth>720){let f=document.querySelector('#modalBody input:not([type="hidden"]),#modalBody select');if(f)f.focus()}},40)}
function closeModal(){document.getElementById('modalRoot').classList.remove('open');modalCtx=null}
function formFields(formId){let form=document.getElementById(formId);if(!form||!form.reportValidity())return null;return Object.fromEntries(new FormData(form).entries())}
function editDayModal(){let d=editedDay();if(!d)return;openModal('Editar o dia de treino',`<form id="editDayForm"><label class="field">Nome do dia<input name="name" required maxlength="60" value="${escapeHTML(d.name)}"></label><label class="field">Foco muscular<input name="focus" maxlength="110" value="${escapeHTML(d.focus)}"></label><div class="two-input"><label class="field">Cardio (min)<input type="number" min="0" max="180" name="cardio" value="${Number(d.cardio)||0}"></label><label class="field">Tipo de cardio<input name="cardioType" maxlength="80" value="${escapeHTML(d.cardioType||'')}"></label></div><label class="field">Observações<textarea name="note" maxlength="600">${escapeHTML(d.note||'')}</textarea></label></form>`, `<button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="save-day">Salvar dia</button>`)}
function exercisePicker(){let all=exercises();openModal('Adicionar exercício',`<p class="help">Pesquise o movimento e toque em “Adicionar”. Ele será colocado no fim deste dia.</p><div class="searchbar"><input id="pickSearch" class="inp" placeholder="Pesquisar exercício..."><select class="inp" id="pickGroup"><option value="">Todos os músculos</option>${T_GROUPS.map(x=>`<option>${x}</option>`).join('')}</select></div><div id="pickResults" class="list" style="max-height:50vh;overflow:auto">${all.slice(0,40).map(x=>pickerRow(x)).join('')}</div>`,`<button class="btn" data-act="close">Concluir</button>`,true);refreshPicker()}
function pickerRow(x){return `<div class="list-row"><div><strong>${escapeHTML(x.name)}</strong><div class="desc">${escapeHTML(x.group)} · ${escapeHTML(x.equipment)}</div></div><button class="btn sm primary" data-act="pick-item" data-id="${escapeHTML(x.id)}">+ Adicionar</button></div>`}
function refreshPicker(){let q=clean(document.getElementById('pickSearch')?.value).toLowerCase(),g=document.getElementById('pickGroup')?.value||'';let list=exercises().filter(x=>(!g||x.group===g)&&(!q||[x.name,x.group].join(' ').toLowerCase().includes(q)));let panel=document.getElementById('pickResults');if(panel)panel.innerHTML=list.slice(0,100).map(pickerRow).join('')||'<div class="empty">Nada encontrado</div>'}
function editItemModal(item){let e=exerciseById(item.exerciseId);let alternatives=exercises().filter(x=>x.group===e.group&&x.id!==e.id).slice(0,25);openModal('Editar exercício',`<form id="editItemForm"><label class="field">Movimento<select name="exerciseId">${[e,...alternatives].map(x=>`<option value="${escapeHTML(x.id)}" ${x.id===item.exerciseId?'selected':''}>${escapeHTML(x.name)}</option>`).join('')}</select></label><div class="three-input"><label class="field">Séries<input name="sets" type="number" min="1" max="20" value="${Number(item.sets)||3}" required></label><label class="field">Reps mínimas<input name="min" type="number" min="1" max="200" value="${Number(item.min)||8}" required></label><label class="field">Reps máximas<input name="max" type="number" min="1" max="200" value="${Number(item.max)||12}" required></label></div><label class="field">Descanso entre séries (segundos)<input name="rest" type="number" min="0" max="600" value="${Number(item.rest)||90}"></label><label class="field">Dica para executar<textarea name="note" maxlength="300">${escapeHTML(item.note||'')}</textarea></label></form><div class="help">Para trocar por outro grupo muscular, remova este movimento e adicione um novo pela biblioteca.</div>`,`<button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="save-item" data-id="${escapeHTML(item.id)}">Salvar exercício</button>`)}
function customExModal(exId){let x=work.customExercises.find(x=>x.id===exId);openModal(x?'Editar exercício personalizado':'Novo exercício personalizado',`<form id="customExForm"><label class="field">Nome do exercício<input name="name" required maxlength="90" value="${escapeHTML(x?.name||'')}"></label><div class="two-input"><label class="field">Músculo principal<select name="group">${T_GROUPS.map(g=>`<option ${g===x?.group?'selected':''}>${g}</option>`).join('')}</select></label><label class="field">Equipamento<input name="equipment" maxlength="60" value="${escapeHTML(x?.equipment||'')}"></label></div><label class="field">Como executar<textarea name="tip" maxlength="400">${escapeHTML(x?.tip||'')}</textarea></label></form>`,`<button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="save-custom" data-id="${escapeHTML(x?.id||'')}">Salvar</button>`)}
function exerciseInfo(exId){let x=exerciseById(exId);let same=exercises().filter(a=>a.group===x.group&&a.id!==x.id).slice(0,6);let youtube='https://www.youtube.com/results?search_query='+encodeURIComponent(x.name+' execução correta academia');openModal(x.name,`<div class="row"><span class="pill lime">${escapeHTML(x.group)}</span><span class="pill">${escapeHTML(x.equipment)}</span></div><div class="card section-space"><h3>Orientação de execução</h3><p>${escapeHTML(x.tip||'Movimento controlado, boa postura e amplitude confortável.')}</p><ol class="listcompact"><li>Ajuste o equipamento e posicione o corpo com estabilidade.</li><li>Faça a fase de esforço sem trancos e mantenha a respiração natural.</li><li>Controle o retorno, sem forçar desconforto ou dor.</li></ol><p class="help">As orientações são gerais; o vídeo é uma busca externa e deve ser avaliado criticamente.</p><a class="btn sm" href="${youtube}" target="_blank" rel="noopener noreferrer">▶ Procurar demonstração em vídeo ↗</a></div><h3 class="section-space">Alternativas do mesmo grupo</h3><div class="list">${same.map(a=>`<div class="list-row"><strong>${escapeHTML(a.name)}</strong><button class="btn sm" data-act="exercise-info" data-id="${escapeHTML(a.id)}">Ver</button></div>`).join('')||'<p class="help">Sem alternativas cadastradas.</p>'}</div>`,`<button class="btn" data-act="close">Fechar</button>`,true)}
function planCreation(scope){if(scope==='client'&&!client())return toast('Cadastre ou selecione um aluno primeiro');let target=scope==='client'?'client':'self';openModal('Criar '+(target==='client'?'ficha para aluno':'meu plano'),`<h3>Escolha como começar</h3><p class="help">Comece com um modelo pronto ou uma ficha vazia. Você poderá editar todos os exercícios depois.</p><button class="btn block" data-act="create-blank" data-target="${target}">＋ Criar ficha vazia</button><hr>${templateCards(target)}`,`<button class="btn" data-act="close">Cancelar</button>`,true)}
function addPlan(p,target){if(target==='client'){let c=client();if(!c)return toast('Aluno não selecionado');c.plans.push(p);currentClientPlanId=p.id;selectedDay=1;view='montar'}else{work.plans.push(p);work.activePlanId=p.id;selectedDay=1;view='treinos'}persist();closeModal();render();toast('Ficha criada e pronta para editar!')}
function previewTemplate(i){let p=MODELS[i]();openModal('Prévia • '+p.name,`<p class="help">${escapeHTML(DESC_MODELS[i])}</p>${p.days.filter(d=>d.items?.length).map(d=>`<div class="card section-space"><h3>${DOW[d.weekday]} • ${escapeHTML(d.name)}</h3><ol class="listcompact">${d.items.map(it=>`<li>${escapeHTML(exerciseById(it.exerciseId).name)} — ${it.sets}×${it.min}–${it.max}</li>`).join('')}</ol></div>`).join('')}`,`<button class="btn" data-act="close">Voltar</button><button class="btn primary" data-act="use-template" data-target="${view==='alunos'||view==='montar'?'client':'self'}" data-model="${i}">Usar modelo</button>`,true)}
function clientForm(c){return `<form id="clientForm"><label class="field">Nome da pessoa<input name="name" maxlength="80" required value="${escapeHTML(c?.name||'')}"></label><label class="field">Contato (opcional)<input name="email" maxlength="120" value="${escapeHTML(c?.email||'')}"></label><label class="field">Objetivo<select name="goal">${GOALS.map(g=>`<option ${g===c?.goal?'selected':''}>${g}</option>`).join('')}</select></label><div class="two-input"><label class="field">Nível<select name="level">${LEVELS.map(l=>`<option ${l===c?.level?'selected':''}>${l}</option>`).join('')}</select></label><label class="field">Dias disponíveis<select name="days">${[2,3,4,5,6].map(n=>`<option value="${n}" ${Number(c?.days||3)===n?'selected':''}>${n} dias / semana</option>`).join('')}</select></label></div><label class="field">Observações de organização (opcional)<textarea name="notes" maxlength="500" placeholder="Ex.: prefere máquinas, academia compacta...">${escapeHTML(c?.notes||'')}</textarea></label><div class="note warn">Evite guardar diagnósticos, medicamentos ou outros dados sensíveis neste app local. Obtenha autorização antes de cadastrar dados pessoais.</div></form>`}
function clientModal(edit=false){let c=edit?client():null;openModal(edit?'Editar aluno':'Cadastrar aluno',clientForm(c),`<button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="save-client" data-id="${escapeHTML(c?.id||'')}">Salvar aluno</button>`)}
function saveClient(id0){let d=formFields('clientForm');if(!d)return;let c=id0?work.clients.find(x=>x.id===id0):null;let isNew=!c;if(isNew){c={id:id(),plans:[],createdAt:new Date().toISOString()};work.clients.push(c)}Object.assign(c,{name:clean(d.name),email:clean(d.email),goal:d.goal,level:d.level,days:Number(d.days),notes:clean(d.notes)});currentClientId=c.id;persist();closeModal();go('alunos');toast(isNew?'Aluno cadastrado!':'Aluno atualizado!')}
function editPlanName(){let p=editedPlan();if(!p)return;openModal('Nome e descrição do plano',`<form id="renameForm"><label class="field">Nome<input name="name" required maxlength="90" value="${escapeHTML(p.name)}"></label><label class="field">Descrição<textarea name="description" maxlength="500">${escapeHTML(p.description||'')}</textarea></label></form>`,`<button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="save-rename">Salvar</button>`)}
function measurementModal(){openModal('Registrar medidas',`<form id="measureForm"><label class="field">Data<input name="date" type="date" required value="${dateKey()}"></label><div class="two-input"><label class="field">Peso corporal (kg)<input name="weight" type="number" min="1" max="700" step="0.1" placeholder="Opcional"></label><label class="field">Cintura (cm)<input name="waist" type="number" min="1" max="400" step="0.1" placeholder="Opcional"></label></div><div class="two-input"><label class="field">Peitoral (cm)<input name="chest" type="number" min="1" max="400" step="0.1" placeholder="Opcional"></label><label class="field">Quadril (cm)<input name="hip" type="number" min="1" max="400" step="0.1" placeholder="Opcional"></label></div><label class="field">Observações<textarea name="notes" maxlength="400"></textarea></label></form>`,`<button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="save-measure">Salvar medidas</button>`)}
function logDetail(logid){let l=work.logs.find(x=>x.id===logid);if(!l)return;openModal('Treino • '+dateBR(l.date),`<div class="note">${escapeHTML(l.dayName||'Sessão')} · ${doneSets(l).length} séries · ${num(totalVolume(l))} kg de volume · ${l.durationMin||'—'} min</div><div class="list section-space">${l.entries.map(e=>`<div class="list-row" style="display:block"><strong>${escapeHTML(e.name)}</strong><p class="help">${(e.sets||[]).map((s,i)=>`${s.done?'✓':'○'} ${i+1}: ${num(s.kg)} kg × ${num(s.reps)} ${s.rir!==''?'(RIR '+escapeHTML(s.rir)+')':''}`).join(' · ')}</p></div>`).join('')}</div><p class="help section-space">Cardio: ${l.cardioMin||0} min. ${escapeHTML(l.notes||'')}</p>`,`<button class="btn" data-act="close">Fechar</button>`,true)}
function printableHTML(p,c){let s=work.settings||{},signed=c?c.name:(account()?.displayName||'Atleta'),start=dateBR(dateKey());let days=[1,2,3,4,5,6,0].map(i=>p.days.find(d=>d.weekday===i)).filter(Boolean);let sessions=days.filter(d=>d.items?.length);let rows=days.map(d=>`<tr><td>${DOW[d.weekday]}</td><td>${escapeHTML(d.name)}</td><td>${escapeHTML(d.focus||'—')}</td><td>${d.items?.length||'—'}</td><td>${d.cardio?d.cardio+' min':'—'}</td></tr>`).join('');return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Ficha de treino - ${escapeHTML(signed)} - ${escapeHTML(p.name)}</title><style>@page{size:A4;margin:15mm 14mm}*{box-sizing:border-box}body{font:11.5px/1.48 Arial,Helvetica,sans-serif;margin:0;color:#19252e;background:white}header{border-bottom:4px solid #b1e66c;padding-bottom:16px;margin-bottom:18px;display:flex;align-items:flex-end;justify-content:space-between;gap:15px}.logo{font-size:26px;font-weight:900;letter-spacing:-1.1px}.logo span{color:#609532}.sub{font-size:9px;font-weight:800;color:#61727a;letter-spacing:2px}.right{text-align:right}.small{font-size:10px;color:#52646e}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 15px}.item{padding:10px;border:1px solid #d4e0e6;border-radius:8px;background:#f6f9f8}.item b{display:block;font-size:10px;color:#5e7380;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}.item strong{font-size:13px}h1{font-size:22px;margin:0 0 6px}h2{font-size:15px;margin:21px 0 9px;color:#23373f;break-after:avoid;page-break-after:avoid}table{width:100%;border-collapse:collapse;table-layout:fixed}th{background:#eaf5df;color:#253c25;text-align:left;font-size:10px}td,th{border-bottom:1px solid #dce5e9;padding:9px 8px;vertical-align:top;word-break:break-word}tbody tr:nth-child(2n){background:#f8fafb}.session{page-break-inside:avoid;break-inside:avoid;margin:0 0 16px;border:1px solid #dce5e9;border-radius:9px;overflow:hidden}.session-title{background:#23393a;color:white;padding:12px 13px;display:flex;justify-content:space-between;align-items:center;gap:9px}.session-title strong{font-size:14px}.session table th{background:#e8f0ef}.session .note{font-size:10px;color:#475961;padding:9px 12px;background:#f1f7f6}.rules{border:1px solid #d9e7dd;background:#f6fbf3;border-radius:9px;padding:13px 16px;break-inside:avoid}.rules li{margin-bottom:6px}.footer{display:flex;justify-content:space-between;border-top:1px solid #ccd9dd;padding-top:12px;margin-top:20px;color:#566872}.muted{color:#5d727d}.chip{display:inline-block;border-radius:20px;padding:3px 9px;font-size:9px;font-weight:800;background:#e1f0d5;color:#446835}.print-help{display:none}@media screen{body{max-width:850px;margin:28px auto;padding:28px;border:1px solid #d2dddd;box-shadow:0 12px 48px #ddd}.print-help{display:block;border:1px solid #aacb9e;padding:12px;background:#f2f8ea;border-radius:8px;margin-bottom:20px}.print-help button{background:#b5e76f;padding:12px;border:0;border-radius:7px;font-weight:bold;cursor:pointer}}</style></head><body><div class="print-help">Prévia pronta. Clique para imprimir e selecione <b>Salvar como PDF</b> no destino de impressão. <button onclick="window.print()">Imprimir / salvar PDF</button></div><header><div><div class="logo">ATLAS <span>TRAINING</span></div><div class="sub">FICHA DE TREINAMENTO PERSONALIZADA</div></div><div class="right small">Elaborada em ${start}<br>${escapeHTML(s.trainerName||'Planejamento de treino')}</div></header><h1>${escapeHTML(p.name)}</h1><p class="small">${escapeHTML(p.description||'Plano de treinamento individualizado.')}</p><div class="meta"><div class="item"><b>${c?'Aluno(a)':'Atleta'}</b><strong>${escapeHTML(signed)}</strong></div><div class="item"><b>Objetivo</b><strong>${escapeHTML(c?.goal||p.goal||s.goal||'Condição física')}</strong></div><div class="item"><b>Experiência</b><strong>${escapeHTML(c?.level||s.level||'Não informada')}</strong></div><div class="item"><b>Frequência</b><strong>${sessions.length} dias / semana</strong></div></div><h2>Organização semanal</h2><table><thead><tr><th style="width:16%">Dia</th><th style="width:20%">Treino</th><th>Foco</th><th style="width:13%">Exercícios</th><th style="width:14%">Cardio</th></tr></thead><tbody>${rows}</tbody></table><h2>Exercícios e orientações</h2>${sessions.map(d=>`<section class="session"><div class="session-title"><strong>${DOW[d.weekday]} • ${escapeHTML(d.name)}</strong><span>${escapeHTML(d.focus||'')}</span></div><table><thead><tr><th style="width:38%">Exercício</th><th style="width:14%">Séries</th><th style="width:18%">Repetições</th><th style="width:15%">Descanso</th><th>Observações</th></tr></thead><tbody>${d.items.map(it=>`<tr><td>${escapeHTML(exerciseById(it.exerciseId).name)}</td><td>${it.sets}</td><td>${it.min===it.max?it.min:it.min+'–'+it.max}</td><td>${it.rest||90}s</td><td>${escapeHTML(it.note||'—')}</td></tr>`).join('')}</tbody></table>${d.cardio||d.note?`<div class="note">${d.cardio?'Cardio: '+d.cardio+' min '+escapeHTML(d.cardioType||'')+'. ':''}${escapeHTML(d.note||'')}</div>`:''}</section>`).join('')}<section class="rules"><h2 style="margin:0 0 6px">Orientações gerais</h2><ul><li>Aqueça gradualmente antes dos exercícios e ajuste amplitude e carga à sua capacidade.</li><li>Execute as repetições com controle, respeitando os descansos indicados.</li><li>Registre cargas e repetições para acompanhar a evolução de forma progressiva.</li><li>Se ocorrer dor ou mal-estar, interrompa o exercício e procure orientação qualificada.</li><li>Este plano deve ser adaptado por profissional habilitado quando necessário.</li></ul></section><div class="footer"><div>ATLAS Training Pro • Ficha gerada em ${start}</div><div class="right">${escapeHTML(s.trainerName||'')}${s.trainerContact?'<br>'+escapeHTML(s.trainerContact):''}</div></div></body></html>`}
function printPlan(planId=null,isClient=false){let p=isClient?client()?.plans.find(x=>x.id===planId):plan();if(!p)return toast('Selecione uma ficha válida');let output=printableHTML(p,isClient?client():null);let popup=window.open('','_blank');if(!popup){download(output,'Ficha_'+safeFilename(isClient?client()?.name:'Meu_treino')+'.html','text/html;charset=utf-8');return toast('Pop-up bloqueado. A prévia HTML foi baixada: abra e imprima em PDF.')}popup.document.open();popup.document.write(output);popup.document.close();popup.focus();toast('Na nova janela, use “Imprimir / salvar PDF”.')}
function safeFilename(x){return String(x||'Treino').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_').slice(0,50)}
function download(text0,filename,type){let b=new Blob([text0],{type});let url=URL.createObjectURL(b);let a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1300)}
function exportBackup(){download(JSON.stringify({format:'ATLAS_TRAINING_PRO_V3',exportedAt:new Date().toISOString(),data:work},null,2),'ATLAS_Backup_'+dateKey()+'.json','application/json;charset=utf-8');toast('Backup exportado! Guarde em local seguro.')}
function exportCSV(){let rows=[['Data','Plano','Treino','Exercício','Série','Carga kg','Repetições','RIR','Concluída','Cardio min','Duração min','Notas']];work.logs.forEach(l=>(l.entries||[]).forEach(e=>(e.sets||[]).forEach((s,i)=>rows.push([l.date,l.planName,l.dayName,e.name,i+1,s.kg,s.reps,s.rir,s.done?'Sim':'Não',l.cardioMin,l.durationMin,l.notes]))));let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download(csv,'ATLAS_Historico_'+dateKey()+'.csv','text/csv;charset=utf-8');toast('Histórico CSV exportado!')}
async function importBackup(file){if(!file)return;let text=await file.text();try{let v=JSON.parse(text);let w=v.format==='ATLAS_TRAINING_PRO_V3'?v.data:v;if(!w||!Array.isArray(w.plans)||!w.plans.length)throw Error('Arquivo não é um backup de treino válido.');if(!confirm('Restaurar este backup substituirá todos os seus dados nesta conta local. Deseja continuar?'))return;work=repairWorkspace(w);persist();currentClientId=null;currentClientPlanId=null;selectedDay=1;go('inicio');toast('Dados restaurados!')}catch(err){toast('Falha ao importar: '+err.message)}}
function calendarEdit(){let d=scheduleFor(selectedCalendarDate),original=plan();openModal('Alterar programação de '+dateBR(selectedCalendarDate),`<form id="overrideForm"><label class="field">Qual treino fazer nesta data?<select name="weekday"><option value="-1" ${!d?.items?.length?'selected':''}>Dia de descanso</option>${[1,2,3,4,5,6,0].map(n=>{let x=original.days.find(d=>d.weekday===n);return `<option value="${n}" ${d?.weekday===n?'selected':''}>${DOW[n]} • ${escapeHTML(x?.name||'Descanso')}</option>`}).join('')}</select></label></form><div class="note warn">Ao substituir uma data, a ficha original não muda. Confira o intervalo de recuperação entre treinos semelhantes.</div>`,`<button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="save-override">Salvar nesta data</button>`)}
function suggestReschedule(){let monday=weekOf(),today=parseDate(dateKey()),miss=[],free=[];for(let i=0;i<7;i++){let date=new Date(monday);date.setDate(date.getDate()+i);let key=dateKey(date),d=scheduleFor(key);if(date<today&&d?.items?.length&&!workoutDone(key))miss.push({key,d});if(date>=today&&!d?.items?.length)free.push({key,d})}if(!miss.length)return toast('Não há treino pendente nesta semana para reorganizar.');if(!free.length)return toast('Não há dia livre nesta semana. Ajuste manualmente pelo calendário.');let missing=miss[0],slot=free[0];openModal('Sugestão de reposição',`<p>Você não registrou <strong>${escapeHTML(missing.d.name)}</strong> em ${dateBR(missing.key)}.</p><p>Sugestão: colocar esse treino em <strong>${dateBR(slot.key)}</strong>, atualmente um dia livre.</p><div class="note warn">É só uma sugestão de agenda. Confira descanso, dor muscular e recuperação antes de aceitar.</div>`,`<button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="confirm-reschedule" data-from="${missing.key}" data-to="${slot.key}" data-day="${missing.d.weekday}">Mover treino</button>`)}
let pendingInstall=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pendingInstall=e});
async function appInstall(){if(pendingInstall){pendingInstall.prompt();await pendingInstall.userChoice;pendingInstall=null}else toast('Instalação PWA disponível somente ao hospedar o pacote em HTTPS compatível.')}
function mutate(callback,success){try{callback();persist();render();if(success)toast(success)}catch(e){console.error(e);toast('Não foi possível concluir a ação.')}}
async function action(el){let a=el.dataset.act,d=el.dataset;if(a==='auth-tab'){loginMode=d.mode;showAuth();return}if(a==='logout'){logout();return}if(a==='nav'){if(d.view==='sessao'&&!work.draft)return go('treinos');go(d.view);return}if(a==='close'){closeModal();return}if(!accountId||!work)return;
switch(a){
case 'select-day':selectedDay=Number(d.day);if(view==='inicio')go('treinos');else render();break;
case 'new-plan':planCreation(d.scope);break;
case 'create-blank':{let p={id:id(),name:'Novo plano • sem nome',goal:'Treino personalizado',description:'Plano criado do zero.',days:emptyDays()};addPlan(p,d.target);break}
case 'use-template':addPlan(initialPlan(MODELS[Number(d.model)]),d.target);break;
case 'preview-template':previewTemplate(Number(d.model));break;
case 'rename-plan':editPlanName();break;
case 'save-rename':{let f=formFields('renameForm');if(!f)return;mutate(()=>{editedPlan().name=clean(f.name);editedPlan().description=clean(f.description)},'Nome atualizado');closeModal();break}
case 'clone-plan':{let p=clone(editedPlan());p.id=id();p.name+=' (cópia)';p.days.forEach(day=>{day.id=id();day.items.forEach(it=>it.id=id())});if(view==='montar'){client().plans.push(p);currentClientPlanId=p.id}else{work.plans.push(p);work.activePlanId=p.id}persist();render();toast('Cópia criada!');break}
case 'delete-plan':{let isClient=view==='montar',p=editedPlan();if(!confirm('Excluir a ficha “'+p.name+'”?'))break;if(isClient){client().plans=client().plans.filter(x=>x.id!==p.id);currentClientPlanId=client().plans[0]?.id||null;persist();go(client().plans.length?'montar':'alunos')}else{if(work.plans.length===1)return toast('É necessário manter ao menos um plano');work.plans=work.plans.filter(x=>x.id!==p.id);work.activePlanId=work.plans[0].id;persist();render()}toast('Ficha excluída');break}
case 'select-client':currentClientId=d.id;currentClientPlanId=client()?.plans[0]?.id||null;render();break;
case 'new-client':clientModal(false);break;
case 'edit-client':clientModal(true);break;
case 'save-client':saveClient(d.id);break;
case 'delete-client':{let c=client();if(!c||!confirm('Excluir o cadastro de '+c.name+' e todas as fichas desta pessoa?'))return;work.clients=work.clients.filter(x=>x.id!==c.id);currentClientId=work.clients[0]?.id||null;currentClientPlanId=null;persist();render();toast('Cadastro excluído');break}
case 'copy-self-to-client':{let c=client();if(!c)return;let p=clone(plan());p.id=id();p.name+=' (adaptar)';p.days.forEach(dd=>{dd.id=id();dd.items.forEach(it=>it.id=id())});c.plans.push(p);currentClientPlanId=p.id;selectedDay=1;persist();go('montar');toast('Cópia criada. Personalize antes de enviar!');break}
case 'open-client-plan':currentClientPlanId=d.id;selectedDay=1;go('montar');break;
case 'edit-day':editDayModal();break;
case 'save-day':{let f=formFields('editDayForm');if(!f)return;mutate(()=>{let day=editedDay();day.name=clean(f.name);day.focus=clean(f.focus);day.cardio=Math.max(0,Number(f.cardio)||0);day.cardioType=clean(f.cardioType);day.note=clean(f.note);day.rest=!day.items.length},'Dia atualizado');closeModal();break}
case 'add-exercise':exercisePicker();break;
case 'pick-item':{let day=editedDay();if(!day)return;let wasEmpty=!day.items.length;day.items.push({id:id(),exerciseId:d.id,sets:3,min:8,max:12,rest:90,note:''});if(wasEmpty){if(day.name==='Descanso')day.name='Treino '+DAYSHORT[day.weekday];if(!day.focus||day.focus==='Recuperação')day.focus=exerciseById(d.id).group}day.rest=false;persist();render();refreshPicker();toast('Exercício adicionado à ficha');break}
case 'edit-item':{let it=editedDay().items.find(x=>x.id===d.id);if(it)editItemModal(it);break}
case 'save-item':{let f=formFields('editItemForm');if(!f)return;if(Number(f.min)>Number(f.max))return toast('Reps mínimas devem ser menores ou iguais às máximas');mutate(()=>{let it=editedDay().items.find(x=>x.id===d.id);Object.assign(it,{exerciseId:f.exerciseId,sets:Number(f.sets),min:Number(f.min),max:Number(f.max),rest:Number(f.rest),note:clean(f.note)})},'Exercício atualizado');closeModal();break}
case 'move-item':{let arr=editedDay().items,i=arr.findIndex(x=>x.id===d.id),j=i+Number(d.move);if(j>=0&&j<arr.length){[arr[i],arr[j]]=[arr[j],arr[i]];persist();render()}break}
case 'remove-item':if(confirm('Remover este exercício?')){let day=editedDay();day.items=day.items.filter(x=>x.id!==d.id);day.rest=day.items.length===0;persist();render();toast('Exercício removido')}break;
case 'exercise-info':exerciseInfo(d.id);break;
case 'custom-ex':customExModal(d.id);break;
case 'save-custom':{let f=formFields('customExForm');if(!f)return;let x=work.customExercises.find(x=>x.id===d.id);if(x)Object.assign(x,{name:clean(f.name),group:f.group,equipment:clean(f.equipment),tip:clean(f.tip)});else work.customExercises.push({id:id(),name:clean(f.name),group:f.group,equipment:clean(f.equipment),tip:clean(f.tip),custom:true});persist();closeModal();render();toast('Biblioteca atualizada');break}
case 'pdf-self':printPlan(null,false);break;
case 'pdf-client':printPlan(d.id,true);break;
case 'start-workout':startWorkout(false);break;
case 'start-today':selectedDay=new Date().getDay();startWorkout(true);break;
case 'add-set':{let arr=work.draft?.entries[Number(d.i)]?.sets;if(arr&&arr.length<30){arr.push({kg:'',reps:'',rir:'',done:false});persist();render()}break}
case 'remove-set':{let arr=work.draft?.entries[Number(d.i)]?.sets;if(arr&&arr.length>1){arr.pop();persist();render()}break}
case 'timer':startRestTimer(Number(d.seconds)||90);break;
case 'stop-timer':stopRestTimer();break;
case 'finish-workout':finishWorkout();break;
case 'discard-workout':if(confirm('Descartar a sessão não concluída?')){work.draft=null;persist();stopRestTimer();go('treinos')}break;
case 'new-measure':measurementModal();break;
case 'save-measure':{let f=formFields('measureForm');if(!f)return;if(!f.weight&&!f.waist&&!f.chest&&!f.hip)return toast('Informe pelo menos uma medida');work.measurements.push({id:id(),date:f.date,weight:f.weight,waist:f.waist,chest:f.chest,hip:f.hip,notes:clean(f.notes)});persist();closeModal();render();toast('Medida salva!');break}
case 'delete-measure':if(confirm('Excluir esta medida?')){work.measurements=work.measurements.filter(x=>x.id!==d.id);persist();render()}break;
case 'log-detail':logDetail(d.id);break;
case 'delete-log':if(confirm('Excluir este treino do histórico?')){work.logs=work.logs.filter(x=>x.id!==d.id);persist();render();toast('Treino removido')}break;
case 'calendar-date':selectedCalendarDate=d.date;render();break;
case 'month-prev':calendarOffset--;render();break;
case 'month-next':calendarOffset++;render();break;
case 'month-today':calendarOffset=0;selectedCalendarDate=dateKey();render();break;
case 'edit-date':calendarEdit();break;
case 'save-override':{let f=formFields('overrideForm');if(!f)return;work.scheduleOverrides[selectedCalendarDate]=Number(f.weekday);persist();closeModal();render();toast('Dia reprogramado!');break}
case 'clear-date':delete work.scheduleOverrides[selectedCalendarDate];persist();render();break;
case 'reschedule':suggestReschedule();break;
case 'confirm-reschedule':work.scheduleOverrides[d.from]=-1;work.scheduleOverrides[d.to]=Number(d.day);persist();closeModal();render();toast('Treino remanejado!');break;
case 'backup':exportBackup();break;
case 'csv':exportCSV();break;
case 'import-backup':document.getElementById('backupInput').click();break;
case 'reset-user':if(confirm('Excluir todos os dados desta conta local? Faça backup primeiro.'))if(confirm('Confirma a exclusão definitiva dos treinos, histórico e alunos deste perfil?')){work=freshWorkspace();currentClientId=null;currentClientPlanId=null;persist();go('inicio');toast('Dados locais reiniciados')}break;
case 'install':appInstall();break;
}
}
document.addEventListener('click',e=>{let el=e.target.closest('[data-act]');if(!el)return;e.preventDefault();action(el).catch?.(err=>{console.error(err);toast('Erro: '+err.message)})});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='authForm'){handleAuth(e.target).catch(err=>toast('Erro no acesso local: '+err.message))}else if(e.target.id==='settingsForm'){let f=formFields('settingsForm');if(!f)return;Object.assign(work.settings,{trainerName:clean(f.trainerName),trainerContact:clean(f.trainerContact),goal:f.goal,level:f.level,weeklyDays:Number(f.weeklyDays)});persist();render();toast('Preferências salvas!')}});

function addExerciseVisuals(root){if(!root)return;root.querySelectorAll('.catalog-item').forEach(el=>{if(el.querySelector('.exercise-visual'))return;let g=el.querySelector('.pill.lime')?.textContent?.trim()||'';let v=document.createElement('div');v.className='exercise-visual';v.innerHTML=anatomySVG(g);el.prepend(v)})}
const prevRender=render;
render=function(){prevRender();addExerciseVisuals(document.getElementById('content'));};
const prevAction=action;
action=async function(el){let result=await prevAction(el);addExerciseVisuals(document.getElementById('content'));return result};
const watchRoot=document.getElementById('content');if(watchRoot){const observer=new MutationObserver(()=>addExerciseVisuals(watchRoot));observer.observe(watchRoot,{childList:true,subtree:true});addExerciseVisuals(watchRoot)}
})();


/* V5.1 LOGIN PATCH */
(function(){
 'use strict';
 let entering=false, temporarySession=false;
 function loginError(message){const target=document.getElementById('atlasLoginIssue');if(target){target.textContent=message;target.hidden=false;}toast(message);}
 function warnStorage(){temporarySession=true;let n=document.getElementById('atlasStorageNotice');if(n)return;n=document.createElement('div');n.id='atlasStorageNotice';n.className='atlas-storage-notice';n.setAttribute('role','alert');n.innerHTML='<strong>Atenção: modo temporário</strong>Este navegador não permitiu salvar os dados. Você pode testar o app, mas os registros podem desaparecer. Para uso diário, abra o endereço publicado no Safari normal, fora do modo privado, e ative o armazenamento.';document.body.appendChild(n);}
 const originalSyncBadge=updateSyncBadge;
 updateSyncBadge=function(){try{return originalSyncBadge()}catch(e){let el=document.getElementById('syncBadge');if(el)el.textContent='Armazenamento indisponível';}};
 const originalPersist=persist;
 persist=function(){try{return originalPersist()}catch(e){warnStorage();}};
 login=function(uid){
   if(!store.accounts.some(a=>a.id===uid)){loginError('Esse perfil não foi encontrado. Digite seu nome novamente.');return;}
   accountId=uid;work=repairWorkspace(store.workspaces[uid]);
   try{localStorage.setItem('atlas_active_user',uid)}catch(e){warnStorage()}
   try{sessionStorage.setItem('atlas_logged_user',uid)}catch(e){}
   view='inicio';selectedDay=new Date().getDay();
   render();playSplash();
   let completed=false;
   try{completed=!!localStorage.getItem('atlas_tutorial_'+uid)}catch(e){completed=true}
   if(!completed)setTimeout(()=>{try{openTutorial()}catch(e){console.warn(e)}},1200);
   else setTimeout(()=>{cloudOnLogin().catch(()=>{})},1300);
 };
 handleAuth=async function(form){
   if(entering)return;
   entering=true;
   let btn=form?.querySelector('[data-act="enter-app"]');
   if(btn)btn.disabled=true;
   try{
     let el=form?.querySelector('[name="displayName"]');
     let name=clean(el?.value).replace(/\s+/g,' ').slice(0,60);
     let err=form?.querySelector('#atlasLoginIssue');if(err)err.hidden=true;
     if(name.length<2){loginError('Digite seu nome com pelo menos duas letras.');el?.focus();return;}
     let existing=store.accounts.find(a=>(a.displayName||a.username||'').toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR'));
     if(existing){login(existing.id);return;}
     let acc={id:id(),username:name.toLocaleLowerCase('pt-BR'),displayName:name,createdAt:new Date().toISOString()};
     store.accounts.push(acc);store.workspaces[acc.id]=freshWorkspace();
     if(!persistAccounts())warnStorage();
     login(acc.id);
     toast(temporarySession?'Entrada temporária: ative o armazenamento para não perder seus treinos.':'Perfil criado! Bem-vindo ao ATLAS.');
   }catch(e){console.error('Erro no login ATLAS',e);loginError('Não foi possível entrar: '+(e.message||'erro desconhecido'));}
   finally{entering=false;if(btn?.isConnected)btn.disabled=false;}
 };
 const oldFinishTutorial=finishTutorial;
 finishTutorial=function(){
   if(accountId){try{return oldFinishTutorial()}catch(e){closeModal();return;}}
   closeModal();
   const f=document.getElementById('authForm'),input=f?.querySelector('[name="displayName"]');
   if(input?.value.trim().length>=2){handleAuth(f).catch(e=>loginError(e.message));}
   else{input?.focus();loginError('Agora digite seu nome e toque em Começar agora.');}
 };
 const oldAtlasAction=action;
 action=async function(el){if(el.dataset.act==='enter-app')return handleAuth(document.getElementById('authForm'));return oldAtlasAction(el)};
 document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('#authForm input[name="displayName"]')){e.preventDefault();handleAuth(document.getElementById('authForm')).catch(err=>loginError(err.message));}});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&accountId){document.getElementById('splash')?.classList.add('off');}});
})();

</script></body></html>
